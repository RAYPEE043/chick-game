<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小雞農場養成計畫</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; text-align: center; background-color: #fff9e6; color: #5d4037; padding: 20px; margin: 0; }
        .hidden { display: none; }
        #loading { margin-top: 50px; font-weight: bold; }
        
        /* 角色選擇卡片 */
        .character-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 20px; }
        .character-card { border: 3px solid #ffcc00; padding: 15px; width: 80%; max-width: 300px; cursor: pointer; border-radius: 15px; background: white; transition: 0.3s; }
        .character-card:hover { transform: scale(1.05); background: #fffde7; }
        
        /* 遊戲主畫面 */
        #game-screen { background: white; border-radius: 30px; padding: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-top: 20px; }
        .pet-image { font-size: 100px; margin: 20px 0; transition: transform 0.2s; }
        .speech-bubble { background: #fef3c7; padding: 15px; border-radius: 20px; margin-bottom: 20px; min-height: 30px; position: relative; border: 1px solid #fcd34d; }
        .speech-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; border-width: 10px 10px 0; border-style: solid; border-color: #fef3c7 transparent; margin-left: -10px; }
        
        .status-bar { font-size: 18px; margin-bottom: 20px; font-weight: bold; }
        .btn { background: #fbbf24; color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 4px 0 #d97706; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <div id="loading">🐣 小雞正在孵化中，請稍候...</div>

    <div id="selection-screen" class="hidden">
        <h2>歡迎！請選擇你的小雞夥伴</h2>
        <div class="character-container">
            <div class="character-card" onclick="startGame('元氣黃', '🐣', ['主人早安！', '我想吃米...', '啾啾！'])">
                <h3>元氣黃 🐣</h3>
                <p>活潑開朗，話有點多。</p>
            </div>
            <div class="character-card" onclick="startGame('酷黑雞', '🐥', ['...你好。', '在忙嗎？', '不要摸我。'])">
                <h3>酷黑雞 🐥</h3>
                <p>非常有個性，不太愛說話。</p>
            </div>
            <div class="character-card" onclick="startGame('害羞白', '🐤', ['那個...你好', '這裡好舒服', '可以餵我嗎？'])">
                <h3>害羞白 🐤</h3>
                <p>膽小怕生，需要溫柔對待。</p>
            </div>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <h2 id="pet-display-name">寵物雞</h2>
        <div class="speech-bubble" id="speech-text">哈囉！</div>
        <div class="pet-image" id="pet-icon">🐣</div>
        <div class="status-bar">飽食度：<span id="fullness">50</span> / 100</div>
        <button class="btn" onclick="feed()">🌾 餵食一把米</button>
        <p style="font-size: 12px; color: #999; margin-top: 20px;">User ID: <span id="display-uid">取得中...</span></p>
    </div>

    <script>
        let gameState = {
            userId: "",
            userName: "",
            petName: "",
            petIcon: "",
            fullness: 50,
            dialogues: []
        };

        // 初始化 LIFF
        async function initLiff() {
            try {
                // 這裡已經填入你的 LIFF ID
                await liff.init({ liffId: "2009796818-mkkoNHCq" }); 
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    gameState.userId = profile.userId;
                    gameState.userName = profile.displayName;
                    
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('display-uid').innerText = gameState.userId;
                    
                    // 顯示選擇畫面
                    document.getElementById('selection-screen').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('loading').innerText = "載入失敗，請確保在 LINE App 內開啟。";
                console.error(error);
            }
        }

        // 開始遊戲
        function startGame(name, icon, specificDialogues) {
            gameState.petName = name;
            gameState.petIcon = icon;
            gameState.dialogues = specificDialogues; // 載入該角色的專屬對話
            
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('pet-display-name').innerText = `${gameState.userName} 的 ${name}`;
            document.getElementById('pet-icon').innerText = icon;
            document.getElementById('speech-text').innerText = "很高興見到你！";
            
            // 每 6 秒讓小雞自言自語一次
            setInterval(petSpeak, 6000);
        }

        // 自言自語功能
        function petSpeak() {
            if (gameState.dialogues.length > 0) {
                const randomText = gameState.dialogues[Math.floor(Math.random() * gameState.dialogues.length)];
                document.getElementById('speech-text').innerText = randomText;
            }
        }

        // 餵食功能
        function feed() {
            if (gameState.fullness < 100) {
                gameState.fullness = Math.min(100, gameState.fullness + 10);
                document.getElementById('fullness').innerText = gameState.fullness;
                
                // 動畫效果
                const icon = document.getElementById('pet-icon');
                icon.style.transform = "scale(1.3)";
                setTimeout(() => icon.style.transform = "scale(1)", 200);
                
                document.getElementById('speech-text').innerText = "好吃！謝謝主人！😋";
            } else {
                document.getElementById('speech-text').innerText = "好飽喔，吃不下了～";
            }
        }

        // 啟動程式
        initLiff();
    </script>
</body>
</html>
